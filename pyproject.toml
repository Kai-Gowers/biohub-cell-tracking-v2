[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-tracking"
version = "0.1.0"
description = "Biohub cell tracking -- port of the public 0.942-LB pipeline: TemporalUNet3D + node transformer, tracksdata ILP, notebook post-processing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "blosc2",
    "torch",
    "geff",
    "zarr",
    "zstandard",
]

[project.optional-dependencies]
dev = [
    "kaggle",
    "jupyter",
    "ipykernel",
    "matplotlib",
]
# ILP graph builder + reference-pack dependencies (install offline from
# context/pack_primary/wheels: pip install --no-index --find-links <wheels> .[ilp]).
# Do not install the bundled geff wheel (1.2.x); the env's geff 1.3.1 is newer.
ilp = [
    "tracksdata",
    "ilpy>=0.5.1",
    "pyscipopt",
    "polars>=1.36",
    "polars_runtime_32",
    "rustworkx>=0.17.1",
    "sqlalchemy>=2",
    "dask",
    "imagecodecs",
    "pyarrow",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
